name: CI

on:
  # Push only on main: a PR from a branch in this repo runs once (pull_request), not twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talaan
          # Throwaway password for a CI-only container; not a secret.
          POSTGRES_PASSWORD: talaan
          POSTGRES_DB: talaan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talaan -d talaan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Both point at the _test DB: alembic reads DATABASE_URL, the pytest guard reads TEST_DATABASE_URL.
      DATABASE_URL: postgresql+psycopg2://talaan:talaan@localhost:5432/talaan_test
      TEST_DATABASE_URL: postgresql+psycopg2://talaan:talaan@localhost:5432/talaan_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check app tests alembic
      - name: Migrate (alembic upgrade head)
        run: python -m alembic upgrade head
      - name: Migration check (alembic check)
        run: python -m alembic check
      - name: Tests (pytest)
        run: python -m pytest -q

  # Decides whether the frontend job runs. `test` above is independent and runs on every PR.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Push to main: always run. Pull request: run only if frontend/ or this workflow changed vs the base.
          if [ "$EVENT" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA"...HEAD | grep -qE '^(frontend/|\.github/workflows/ci\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
