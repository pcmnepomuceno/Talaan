name: talaan

services:
  db:
    image: postgres:16
    container_name: talaan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talaan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-talaan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - talaan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talaan} -d ${POSTGRES_DB:-talaan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: talaan-api
    restart: unless-stopped
    # Limits, TRUST_PROXY and BCRYPT_ROUNDS come from .env (optional). `environment` wins
    # over env_file, so DATABASE_URL below (host `db`) replaces the .env one (`localhost`).
    # COOKIE_SECURE defaults to true (production); for plain http on :8000 set
    # COOKIE_SECURE=false in your local .env, or the browser never sends the cookie back.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-talaan}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-talaan}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  talaan_pgdata:
